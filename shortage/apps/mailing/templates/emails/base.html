<!DOCTYPE html>
<html
  lang="en"
  xmlns="http://www.w3.org/1999/xhtml"
  xmlns:o="urn:schemas-microsoft-com:office:office"
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="x-apple-disable-message-reformatting" />
    <title></title>
    <!--[if mso]>
      <noscript>
        <xml>
          <o:OfficeDocumentSettings>
            <o:PixelsPerInch>96</o:PixelsPerInch>
          </o:OfficeDocumentSettings>
        </xml>
      </noscript>
    <![endif]-->
    <style>
      table,
      td,
      div,
      h1,
      p {
        font-family: Arial, sans-serif;
      }
    </style>
  </head>
  <body style="margin: 0; padding: 10px">
    <table
      role="presentation"
      style="
        width: 100%;
        border-collapse: collapse;
        border: 0;
        border-spacing: 0;
        background: #ffffff;
      "
    >
      <tr>
        <td align="center" style="padding: 0">
          <table
            role="presentation"
            style="
              width: 602px;
              border-collapse: collapse;
              border: 1px solid #e5e5e5;
              border-spacing: 0;
              text-align: left;
            "
          >
            <tr>
              <td
                align="left"
                style="
                  padding: 30px 0 30px 30px;
                  background: #ffffff;
                  border-bottom: 1px solid #e5e5e5;
                "
              >
                <a
                  href="https://shortage.global"
                  style="
                    display: block;
                    width: 131px;
                    height: 32px;
                  "
                >
                  <img
                    src="https://shortage-global.sfo3.digitaloceanspaces.com/shortage-global/static/emails/Shortage.png"
                    alt=""
                    width="131"
                    height="32"
                    style="height: auto; display: block"
                  />
                </a>
              </td>
            </tr>
            <tr>
              <td style="padding: 36px 30px 42px 30px">
                <table
                  role="presentation"
                  style="
                    width: 100%;
                    border-collapse: collapse;
                    border: 0;
                    border-spacing: 0;
                  "
                >
                  <tr>
                    <td style="padding: 0 0 0 0; color: #000000">
                      {% block body_content %}{% endblock %}

                      {% block body_contact_support %}
                      <p
                        style="
                          margin: 0 0 0 0;
                          font-size: 16px;
                          line-height: 24px;
                          font-family: Arial, sans-serif;
                        "
                      >
                        Please contact us at <a href="mailto:support@shortage.global" style="color: #00b657; text-decoration: underline;">support@shortage.global</a> if you have any questions or concerns.
                      </p>
                      {% endblock %}

                      {% block body_signature %}
                      <p
                        style="
                          margin: 32px 0 0 0;
                          font-size: 16px;
                          line-height: 24px;
                          font-family: Arial, sans-serif;
                        "
                      >
                        With love,
                      </p>
                      <p
                        style="
                          margin: 0 0 0 0;
                          font-size: 16px;
                          line-height: 24px;
                          font-family: Arial, sans-serif;
                        "
                      >
                        The Shortage Team
                      </p>
                      
                      {% endblock %}
                    </td>
                  </tr>
                </table>
              </td>
            </tr>
            <tr>
              <td style="padding: 30px; background: #f2f2f2">
                <table
                  role="presentation"
                  style="
                    width: 100%;
                    border-collapse: collapse;
                    border: 0;
                    border-spacing: 0;
                    font-size: 9px;
                    font-family: Arial, sans-serif;
                  "
                >
                  <tr>
                    <td style="padding: 0; width: 50%" align="center">
                      <p
                        style="
                          margin: 0;
                          font-size: 14px;
                          line-height: 16px;
                          font-family: Arial, sans-serif;
                          color: #767576;
                        "
                      >
                        &copy; {% now 'Y' %} All rights reserved. Shortage
                      </p>
                    </td>
                  </tr>
                </table>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
