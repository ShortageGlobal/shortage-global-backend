{% extends "emails/base.html" %}

{% block body_content %}
<h1 style="
  font-size: 20px; 
  margin: 0 0 20px 0; 
  font-family: Arial, sans-serif; 
  text-align: center;"
>
  We have great news for you!
</h1>

<p
  style="
    margin: 0 0 0 0;
    font-size: 16px;
    line-height: 24px;
    font-family: Arial, sans-serif;
  "
>
  Just wanted to inform you that a new in-kind donation is on its way to you.
</p>

<p
  style="
    margin: 0 0 0 0;
    line-height: 24px;
    font-family: Arial, sans-serif;
    text-align: center;
  "
>
  <a 
    href="{{ donation_url }}"
    style="
      margin: 42px 0 42px 0;
      padding: 16px 16px 16px 16px;
      background-color:#00b657;
      color:#ffffff;
      display:inline-block;
      font-family: Arial, sans-serif;
      font-size:18px;
      font-weight:bold;
      text-align:center;
      text-decoration:none;
      -webkit-text-size-adjust:none;"
    >
      Review the package
    </a>
</p>
{% endblock %}
