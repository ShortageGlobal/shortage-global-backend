name: main

on: pull_request

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3
      - uses: lgeiger/black-action@master
        with:
          args: ". --check"

  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Build the image
        run: docker compose up --build

      - name: Run the tests
        run: docker compose exec django python manage.py test
