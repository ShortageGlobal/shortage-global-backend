name: Code style check

on: pull_request

jobs:
  pre-commit:
    name: Run all pre-commit hooks
    runs-on: ubuntu-18.04
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v3
      - name: Run all pre-commit hooks
        uses: pre-commit/action@v3.0.0
