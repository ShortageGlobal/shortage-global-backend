name: build

on: pull_request

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v1
      - uses: lgeiger/black-action@master
        with:
          args: ". --check"

  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v1
      - uses: actions/setup-python@v2
      - run: pip install -r requirements.txt
      - run: DJANGO_ENV=test python manage.py test
