server {
    listen       80;
    root         /var/www/html;

    add_header 'X-Frame-Options'           'SAMEORIGIN'                always;
    add_header 'X-XSS-Protection'          '1; mode=block'             always;
    add_header 'Strict-Transport-Security' 'max-age=31536000; preload' always;
    add_header 'X-Content-Type-Options'    'nosniff'                   always;
    add_header 'Content-Security-Policy'   "default-src 'self' data:; script-src 'self' * 'unsafe-inline' 'unsafe-eval'; style-src 'unsafe-inline' * 'self' data:; font-src * 'self' data:; connect-src 'self' *; img-src * 'self' data: blob:; child-src * 'self'; frame-src * 'self'; " always;


    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        proxy_buffering        on;
        proxy_cache            mycache;
        proxy_cache_valid      200  1m;
        proxy_cache_use_stale  error timeout invalid_header updating
                               http_500 http_502 http_503 http_504;
    }

    location /ping {
        return 200;
        access_log off;
    }

    location /static/ {
        expires 14d;
        access_log off;
        add_header Cache-Control "max-age=2629746, public";

        autoindex on;
        alias /var/www/html/static/;
    }

    client_max_body_size 10M;
}
