user  nginx;
worker_processes  1;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;


events {
    worker_connections  1024;
}


http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    #tcp_nopush     on;

    keepalive_timeout  65;

    gzip on;
    gzip_proxied any;
    gzip_disable "msie6";
    gzip_vary on;
    gzip_types text/xml text/plain text/css text/json text/js text/javascript image/svg+xml application/xml application/json application/x-javascript application/javascript application/hal+json;

    proxy_cache_path /data/nginx/cache levels=1:2 keys_zone=mycache:10m inactive=24h use_temp_path=off max_size=1g;

    include /etc/nginx/conf.d/*.conf;
}
