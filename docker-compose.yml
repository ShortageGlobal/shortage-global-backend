version: '3.8'
services:
  django:
    container_name: shortage-global-django
    build: .
    command: python /project/manage.py runserver 0.0.0.0:8080
    volumes:
      - .:/project
    ports:
      - 8080:8080
    depends_on:
      - db
  db:
    container_name: shortage-global-postgres
    image: postgres
    environment:
      POSTGRES_PASSWORD: postgres
    ports: 
      - 5432:5432
    volumes:
      - postgres_data:/var/lib/postgresql/data/

  # for receiving emails in local environment 
  # without using any 3rd party API
  mailcatcher:
    container_name: shortage-global-mailcatcher
    image: schickling/mailcatcher
    ports:
      - 1080:1080

volumes:
  postgres_data:
