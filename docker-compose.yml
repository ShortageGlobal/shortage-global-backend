version: '3.8'
services:
  django:
    container_name: shortage-global-django
    build: .
    command: python /project/manage.py runserver 0.0.0.0:8080
    volumes:
      - .:/project
    ports:
      - 8080:8080
    depends_on:
      - db
  db:
    container_name: shortage-global-postgres
    image: postgres
    environment:
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data/
volumes:
  postgres_data: